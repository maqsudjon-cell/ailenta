# Cloudflare Worker — jadval uchun ishonchli soat.
#
# GitHub cron bu repozitoriyada bir marta ham ishlamadi (11 yugurishning
# hammasi qo'lda turtilgan). Shuning uchun jadvalni Cloudflare yuritadi.
#
# Bu fayl ATAYLAB repozitoriyada turadi: ilgari u vaqtinchalik papkada edi
# va o'chib ketgan, shu sababli cron sozlamasi ham yo'qolgan.
#
# Yoyish:  npx wrangler deploy
# Maxfiy:  npx wrangler secret put GITHUB_TOKEN

name = "ailenta-cron"
main = "cloudflare-worker.js"
compatibility_date = "2026-09-01"

[triggers]
# :35 da — cron-job.org har soat :00 da turtadi va ikkalasi bir daqiqada
# ishga tushsa, ikkita yugurish bir vaqtda Telegramga yuborib yuborardi
# (o'lchandi: 00:00:33 va 00:01:13 da ikkita yugurish). Vaqtni ajratamiz.
crons = ["35 */3 * * *"]
