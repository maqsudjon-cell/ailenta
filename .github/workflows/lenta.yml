name: Lenta

# Har 3 soatda: yangiliklarni yig'ib, o'zbekchada yozib, saytga chiqaradi.
# Qo'lda ham ishga tushirish mumkin (Actions > Lenta > Run workflow).
on:
  schedule:
    # GitHub jadvalni 20-50 daqiqa kechiktiradi va ba'zi vaqtlarni umuman
    # o'tkazib yuboradi (bu shu akkauntdagi boshqa repoda ham kuzatildi:
    # cron '15 */3' bo'lsa ham yugurishlar 00:36, 08:36, 14:07 da bo'lgan).
    # Shuning uchun har uch soatlik oynaga ikkita vaqt qo'yamiz — biri
    # o'tkazib yuborilsa, ikkinchisi ushlaydi. Takror yugurish arzon:
    # yangi xabar bo'lmasa quvur LLM'ga umuman murojaat qilmaydi.
    - cron: "21 */3 * * *"
    - cron: "51 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lenta
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Paketlarni o'rnatish
        run: npm ci

      - name: Manbalarni yig'ish
        run: node src/collect.mjs

      - name: Saralash va klasterlash
        run: node src/filter.mjs

      - name: O'zbekchada yozish
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node src/write.mjs

      - name: Sahifalarni qurish
        run: node src/build.mjs

      - name: Saytni tekshirish
        continue-on-error: true
        run: node src/audit.mjs

      - name: Telegram kanalga yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/telegram.mjs

      - name: Nashr qilish
        run: |
          git config user.name "ai-lenta-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "Yangi xabar yo'q — commit qilinmadi."
          else
            git commit -m "lenta: $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: Qidiruv tizimlariga bildirish
        run: node src/indexnow.mjs

      # Instagram rasmni faqat havola orqali oladi, shuning uchun bu qadam
      # saytga chiqqandan keyin turadi va rasm ochilishini o'zi kutadi.
      - name: Instagramga joylash
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node src/instagram.mjs
