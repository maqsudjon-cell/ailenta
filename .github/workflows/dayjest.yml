name: Dayjest

# Kunlik dayjest endi lenta.yml ichida, soatlik quvurda ishlaydi va vaqtni
# O'ZI hal qiladi (Toshkent bo'yicha 20:00 dan keyin, kuniga bir marta).
#
# Jadval shu sababdan olib tashlandi: u faqat GitHub cron'iga bog'liq edi,
# GitHub esa bu repozitoriyada kuniga 1-2 marta ishlaydi — kunda bir marta
# chiqadigan post umuman chiqmay qolishi mumkin edi.
#
# Bu fayl faqat qo'lda ishga tushirish uchun qoldi.
on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dayjestni yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/digest.mjs
