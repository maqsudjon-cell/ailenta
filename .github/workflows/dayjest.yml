name: Dayjest

# Har kuni ertalab 09:00 (Toshkent) — o'tgan sutkaning eng muhim xabarlari
# bitta post bo'lib Telegram kanalga chiqadi.
on:
  schedule:
    # 09:07 Toshkent. Soat boshidan siljitilgan — qarang: lenta.yml
    - cron: "7 4 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dayjestni yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/digest.mjs
